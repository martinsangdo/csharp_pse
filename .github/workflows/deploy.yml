name: Build and Deploy to Render

on:
  push:
    branches: [ "main" ] # Triggers the workflow only when you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Required to build for different architectures (like AMD64 on an ARM runner)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Sets up the modern Docker build engine
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          # Sets the scope to your project folder so COPY commands work
          context: ./WebApplication1
          # Points to the Dockerfile inside that subfolder
          file: ./WebApplication1/Dockerfile 
          # Forces the platform Render requires
          platforms: linux/amd64
          push: true
          tags: sangdomartin/c_repo:c-mvc-app

  deploy-to-render:
    needs: build-and-push # Only runs if the Docker push is successful
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}